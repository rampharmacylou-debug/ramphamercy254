<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b7a62" />
  <title>You're offline</title>
  <style>
    :root { --brand: #0b7a62; --ink: #12211d; --muted: #5b6b66; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: color-mix(in srgb, var(--brand) 5%, white); color: var(--ink);
      font-family: Figtree, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; background: #fff; border-radius: 14px; padding: 28px;
      border: 1px solid color-mix(in srgb, var(--brand) 16%, white); text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    img { width: 56px; height: 56px; border-radius: 12px; }
    h1 { font-size: 1.25rem; margin: 16px 0 6px; letter-spacing: -0.015em; }
    p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
    button {
      margin-top: 20px; width: 100%; padding: 12px 16px; border: 0; border-radius: 8px;
      background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:hover { filter: brightness(.95); }
    .hint { margin-top: 12px; font-size: .75rem; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>The app needs an internet connection to show products, the diary and clients. Check your Wi-Fi or mobile data.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="hint">It will reconnect by itself when the connection is back.</p>
  </main>
  <script>
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
